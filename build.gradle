buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Release documentation: the project remains on the Android Gradle Plugin version
        // selected by the application baseline and compiled with Java 8 compatibility.
        classpath 'com.android.tools.build:gradle:3.6.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Release dependency source used by the QR generation library.
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Release build convenience task: exposes the application debug build from the root project.
task assembleDebug(dependsOn: ':app:assembleDebug')
