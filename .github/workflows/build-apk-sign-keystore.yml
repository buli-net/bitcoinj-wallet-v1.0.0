name: Build BitcoinJ Wallet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

# Chỉ chạy thủ công bằng nút "Run workflow"
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 8
      # ==========================================================
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "zulu"


      # ==========================================================
      # 3. XÓA GRADLE CACHE
      # ==========================================================
      - name: Xóa cache cũ
        run: |
          rm -rf ~/.gradle/caches


      # ==========================================================
      # 4. ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;28.0.3 platforms;android-28"


      # ==========================================================
      # 5. CHỈ GIỮ BUILD-TOOLS 28.0.3
      # ==========================================================
      - name: Giữ lại build-tools 28.0.3 duy nhất
        run: |
          cd "$ANDROID_HOME/build-tools"

          for dir in *; do
            [ "$dir" = "28.0.3" ] || rm -rf "$dir"
          done

          echo "Build-tools hiện tại:"
          ls -la


      # ==========================================================
      # 6. GRADLEW
      # ==========================================================
      - name: chmod +x gradlew
        run: |
          chmod +x ./gradlew


      # ==========================================================
      # 7. BUILD RELEASE APK
      #
      # assembleRelease thay cho assembleDebug.
      #
      # APK này sau đó sẽ được ký bằng keystore của bạn.
      # ==========================================================
      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 8. TÌM RELEASE APK
      # ==========================================================
      - name: Tìm Release APK
        run: |
          APK=$(find . \
            -path "*/build/outputs/apk/release/*.apk" \
            -type f \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Không tìm thấy Release APK."
            exit 1
          fi

          echo "APK tìm thấy:"
          echo "$APK"

          cp "$APK" "$RUNNER_TEMP/BitcoinJ-Wallet-unsigned.apk"


      # ==========================================================
      # 9. KIỂM TRA 5 SECRETS
      # ==========================================================
      - name: Kiểm tra signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 chưa được cấu hình."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD chưa được cấu hình."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS chưa được cấu hình."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD chưa được cấu hình."
            exit 1
          fi

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: EXPECTED_CERT_SHA256 chưa được cấu hình."
            exit 1
          fi

          echo "Đã tìm thấy đủ 5 Repository Secrets."


      # ==========================================================
      # 10. GIẢI MÃ KEYSTORE
      # ==========================================================
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/keystore.jks"

          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "ERROR: Không tạo được keystore."
            exit 1
          fi

          echo "Keystore đã được khôi phục."


      # ==========================================================
      # 11. KIỂM TRA KEYSTORE + ALIAS
      #
      # Không in password.
      # ==========================================================
      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/keystore-info.txt"

          echo "Keystore hợp lệ."
          echo "Alias: $KEY_ALIAS"


      # ==========================================================
      # 12. TÌM APK SIGNER
      # ==========================================================
      - name: Find apksigner
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/28.0.3/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Không tìm thấy apksigner."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          "$APKSIGNER" --version


      # ==========================================================
      # 13. KÝ RELEASE APK
      #
      # KEYSTORE_BASE64
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD
      #
      # apksigner tạo chữ ký APK.
      # ==========================================================
      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
            "$RUNNER_TEMP/BitcoinJ-Wallet-unsigned.apk"

          echo "APK đã được ký."


      # ==========================================================
      # 14. VERIFY APK SIGNATURE
      #
      # Kiểm tra chữ ký APK.
      # ==========================================================
      - name: Verify APK signature
        run: |
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/BitcoinJ-Wallet.apk"


      # ==========================================================
      # 15. KIỂM TRA EXPECTED_CERT_SHA256
      #
      # Secret thứ 5:
      #
      # EXPECTED_CERT_SHA256
      #
      # Dùng để đảm bảo APK được ký bằng đúng certificate.
      # ==========================================================
      - name: Verify certificate fingerprint
        env:
          EXPECTED_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          ACTUAL=$(
            "$APKSIGNER" verify \
              --print-certs \
              "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
              | grep "Signer #1 certificate SHA-256 digest:" \
              | head -1 \
              | sed 's/.*: //' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]'
          )

          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')

          echo "Expected certificate SHA-256:"
          echo "$EXPECTED"

          echo "Actual certificate SHA-256:"
          echo "$ACTUAL"

          if [ -z "$ACTUAL" ]; then
            echo "ERROR: Không lấy được certificate fingerprint."
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo ""
            echo "ERROR: CERTIFICATE FINGERPRINT MISMATCH!"
            echo ""
            echo "APK không được ký bằng certificate mong đợi."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CERTIFICATE VERIFIED"
          echo "FINGERPRINT MATCH"
          echo "=========================================="


      # ==========================================================
      # 16. COPY APK CUỐI CÙNG
      # ==========================================================
      - name: Prepare final APK
        run: |
          cp \
            "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk"

          echo ""
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk"


      # ==========================================================
      # 17. TÍNH SHA-256 FILE APK
      #
      # Đây là SHA-256 của FILE APK,
      # khác với EXPECTED_CERT_SHA256.
      # ==========================================================
      - name: Generate APK SHA-256
        run: |
          sha256sum \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk" \
            | tee "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk.sha256"


      # ==========================================================
      # 18. UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-SIGNED
          path: |
            BitcoinJ-Wallet.apk
            BitcoinJ-Wallet.apk.sha256
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
