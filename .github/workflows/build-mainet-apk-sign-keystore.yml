name: Build BitcoinJ Wallet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

# Manual trigger only.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout source
        uses: actions/checkout@v4


      # Java 8
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "zulu"


      # Clear Gradle cache
      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches


      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;28.0.3 platforms;android-28"


      # Keep build-tools 28.0.3
      - name: Keep build-tools 28.0.3
        run: |
          cd "$ANDROID_HOME/build-tools"

          for dir in *; do
            [ "$dir" = "28.0.3" ] || rm -rf "$dir"
          done

          echo "Installed build-tools:"
          ls -la


      # Prepare Gradle wrapper
      - name: chmod +x gradlew
        run: |
          chmod +x ./gradlew


      # Build release APK
      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon


      # Find release APK
      - name: Find release APK
        run: |
          APK=$(find . \
            -path "*/build/outputs/apk/release/*.apk" \
            -type f \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          cp "$APK" "$RUNNER_TEMP/BitcoinJ-Wallet-unsigned.apk"


      # Check signing secrets
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is not configured."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: EXPECTED_CERT_SHA256 is not configured."
            exit 1
          fi

          echo "All signing secrets are configured."


      # Decode keystore
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/keystore.jks"

          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore restored."


      # Verify keystore
      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/keystore-info.txt"

          echo "Keystore verified."
          echo "Alias: $KEY_ALIAS"


      # Find apksigner
      - name: Find apksigner
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/28.0.3/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          "$APKSIGNER" --version


      # Sign release APK
      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
            "$RUNNER_TEMP/BitcoinJ-Wallet-unsigned.apk"

          echo "Release APK signed."
      # Verify APK signature
      - name: Verify APK signature
        run: |
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/BitcoinJ-Wallet.apk"
      # Verify certificate fingerprint
      - name: Verify certificate fingerprint
        env:
          EXPECTED_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          ACTUAL=$(
            "$APKSIGNER" verify \
              --print-certs \
              "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
              | grep "Signer #1 certificate SHA-256 digest:" \
              | head -1 \
              | sed 's/.*: //' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]'
          )

          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')

          echo "Expected certificate SHA-256:"
          echo "$EXPECTED"

          echo "Actual certificate SHA-256:"
          echo "$ACTUAL"

          if [ -z "$ACTUAL" ]; then
            echo "ERROR: Certificate fingerprint not found."
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo ""
            echo "ERROR: Certificate fingerprint mismatch."
            echo ""
            echo "APK was not signed with the expected certificate."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CERTIFICATE VERIFIED"
          echo "FINGERPRINT MATCH"
          echo "=========================================="


      # 16. Prepare final APK
      - name: Prepare final APK
        run: |
          cp \
            "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk"

          echo ""
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk"


      # 17. Generate APK SHA-256
      - name: Generate APK SHA-256
        run: |
          sha256sum \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk" \
            | tee "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk.sha256"


      # 18. Upload artifact
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-SIGNED
          path: |
            BitcoinJ-Wallet.apk
            BitcoinJ-Wallet.apk.sha256
          if-no-files-found: error
          retention-days: 90
