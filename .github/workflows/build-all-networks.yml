name: Build BitcoinJ Wallet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Xóa cache Gradle cũ
        run: rm -rf ~/.gradle/caches

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;28.0.3 platforms;android-28"

      - name: Giữ lại build-tools 28.0.3
        run: |
          cd "$ANDROID_HOME/build-tools"
          for dir in *; do
            [ "$dir" = "28.0.3" ] || rm -rf "$dir"
          done

      - name: chmod +x gradlew
        run: chmod +x gradlew

      # ==========================================
      # DEBUG SOURCE - PHẢI CHẠY TRƯỚC BUILD
      # ==========================================
      - name: Verify source used by CI
        run: |
          echo "========================================"
          echo "COMMIT"
          echo "========================================"
          git rev-parse HEAD

          echo "========================================"
          echo "BRANCH"
          echo "========================================"
          git branch --show-current

          echo "========================================"
          echo "MANIFEST USED BY CI"
          echo "========================================"
          sed -n '1,20p' app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "ALL package= DECLARATIONS"
          echo "========================================"
          grep -RIn 'package=' app/src || true

          echo "========================================"
          echo "SEARCH package=\"wallet\""
          echo "========================================"
          grep -RIn 'package="wallet"' . \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"
          git status --short

          echo "========================================"
          echo "MANIFEST FROM CURRENT COMMIT"
          echo "========================================"
          git show HEAD:app/src/main/AndroidManifest.xml | sed -n '1,20p'

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      # ==========================================
      # RENAME APK
      # ==========================================
      - name: Đổi tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)

          if [ -z "$APK" ]; then
            echo "Không tìm thấy APK"
            exit 1
          fi

          echo "APK: $APK"
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      # ==========================================
      # ARTIFACT
      # ==========================================
      - uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
