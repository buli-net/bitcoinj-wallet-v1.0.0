name: Build BitcoinJ Wallet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;28.0.3 platforms;android-28"

      # Chỉ giữ build-tools 28.0.3
      - name: Giữ lại build-tools 28.0.3 duy nhất
        run: |
          cd "$ANDROID_HOME/build-tools"
          for dir in *; do
            [ "$dir" = "28.0.3" ] || rm -rf "$dir"
          done

      - name: chmod +x gradlew
        run: chmod +x gradlew

      # DEBUG SOURCE
      - name: DEBUG SOURCE
        run: |
          echo "========================================"
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo "========================================"
          echo "===== BRANCH ====="
          git branch --show-current

          echo "========================================"
          echo "===== MANIFEST ====="
          sed -n '1,20p' app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "===== ALL PACKAGE DECLARATIONS ====="
          grep -RIn 'package=' app/src || true

          echo "========================================"
          echo "===== SEARCH package=\"wallet\" ====="
          grep -RIn 'package="wallet"' . \
            --exclude-dir=.git \
            --exclude-dir=build || true

          echo "========================================"
          echo "===== SEARCH package=\"wallet.buli.net\" ====="
          grep -RIn 'package="wallet.buli.net"' . \
            --exclude-dir=.git \
            --exclude-dir=build || true

          echo "========================================"
          echo "===== MANIFEST FROM GIT HEAD ====="
          git show HEAD:app/src/main/AndroidManifest.xml | sed -n '1,20p'

          echo "========================================"
          echo "===== GIT STATUS ====="
          git status --short

          echo "========================================"
          echo "===== END DEBUG SOURCE ====="
          echo "========================================"

      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Đổi tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          test -n "$APK"
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
