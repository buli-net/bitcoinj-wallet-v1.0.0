plugins {
    id 'com.android.application'
}

android {
    namespace 'wallet.main'
    compileSdk 37

    defaultConfig {
        applicationId 'wallet.main'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles project.android.getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/*.version',
                    'META-INF/proguard/**',
                    'META-INF/**/coroutines.pro',
                    '**/*.proto',
                    'org/bouncycastle/**/*.properties',
                    'org/bitcoinj/crypto/cacerts',
                    'org.bitcoin.*.checkpoints.txt'
            ]
        }
    }
}

configurations.configureEach {
    exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:1.7.36'
    }
}

dependencies {
    implementation('com.android.support:appcompat-v7:28.0.0') {
        exclude group: 'com.android.support', module: 'animated-vector-drawable'
    }
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'org.bitcoinj:bitcoinj-core:0.17.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.1'
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'org.slf4j:slf4j-android:1.7.36'
}
