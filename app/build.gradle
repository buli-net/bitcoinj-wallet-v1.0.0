apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "com.example.thinkmobiles.bitcoinwalletsample"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    exclude group: 'com.google.code.findbugs', module: 'jsr305'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
    exclude group: 'net.jcip', module: 'jcip-annotations'

    resolutionStrategy {
        force 'com.google.guava:guava:27.0.1-jre'
        force 'org.slf4j:slf4j-api:1.7.36'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation('org.bitcoinj:bitcoinj-core:0.17.1') {
        exclude group: 'com.google.code.findbugs'
        exclude group: 'net.jcip'
        exclude group: 'com.google.guava'
        exclude group: 'org.slf4j'
    }

    // Required by bitcoinj 0.17.1.
    // Do NOT replace this with protobuf-java.
    implementation 'com.google.protobuf:protobuf-javalite:4.33.4'

    implementation 'com.google.guava:guava:27.0.1-jre'
    implementation 'org.slf4j:slf4j-api:1.7.36'

    testImplementation 'junit:junit:4.13.1'

    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
